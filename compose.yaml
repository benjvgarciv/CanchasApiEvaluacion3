services:
  # 1. Base de Datos Relacional SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canchas-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-${DB_PASSWORD:-TuPasswordSeguro123!}}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-${DB_PORT:-1433}}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      canchas-network:
        aliases:
          - db
          - sqlserver
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD:-${DB_PASSWORD:-TuPasswordSeguro123!}}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Backend ASP.NET Core 10 Minimal APIs
  backend:
    build:
      context: ./CanchasApi26-08/CanchasApi
      dockerfile: Dockerfile
    container_name: canchas-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5098}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      ConnectionStrings__miconexion: "Server=sqlserver,1433;Database=ReservasCanchasDB;User Id=sa;Password=${SA_PASSWORD:-${DB_PASSWORD:-TuPasswordSeguro123!}};TrustServerCertificate=True;"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ReservasCanchasDB;User Id=sa;Password=${SA_PASSWORD:-${DB_PASSWORD:-TuPasswordSeguro123!}};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:-SuperSecretKeyForCanchasApiEvaluacion3_Min32Chars!2026}"
      Jwt__Issuer: "${JWT_ISSUER:-CanchasApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-CanchasApp}"
      AI__ApiKey: "${AI_API_KEY:-}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
    depends_on:
      - sqlserver
    networks:
      - canchas-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Frontend React 19 + TypeScript + Nginx Alpine
  frontend:
    build:
      context: ./CanchasApi26-08/frontend
      dockerfile: Dockerfile
    container_name: canchas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - canchas-network

networks:
  canchas-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
