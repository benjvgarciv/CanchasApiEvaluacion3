services:
  # 1. Base de Datos Relacional SQL Server 2022
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canchas-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-ClaveSegura123!}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - canchas-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD:-ClaveSegura123!} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Backend ASP.NET Core 10 Minimal APIs
  backend:
    build:
      context: ./CanchasApi26-08/CanchasApi
      dockerfile: Dockerfile
    container_name: canchas-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5098}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__miconexion=Server=db,1433;Database=ReservasCanchasDB;User Id=sa;Password=${DB_PASSWORD:-ClaveSegura123!};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-SuperSecretSecretKeyWithAtLeast32BytesLength!}
      - Jwt__Issuer=${JWT_ISSUER:-CanchasApi}
      - Jwt__Audience=${JWT_AUDIENCE:-CanchasApp}
      - AI__ApiKey=${AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - canchas-network

  # 3. Frontend React 19 + TypeScript + Nginx Alpine
  frontend:
    build:
      context: ./CanchasApi26-08/frontend
      dockerfile: Dockerfile
    container_name: canchas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - canchas-network

networks:
  canchas-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
